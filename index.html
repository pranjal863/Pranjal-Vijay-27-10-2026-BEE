<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEasy - E-Commerce Cart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <div class="logo">ShopEasy</div>
    <button id="cartBtn" class="cart-btn">🛒 Cart <span id="cartCount">0</span></button>
</header>

<main class="container">
    <section class="hero">
        <h1>Simple Shopping</h1>
        <p>Find your favorite products and add them to your cart.</p>
    </section>

    <section class="controls">
        <input type="text" id="searchInput" placeholder="Search products...">

        <select id="categoryFilter">
            <option value="all">All Categories</option>
            <option value="electronics">Electronics</option>
            <option value="clothing">Clothing</option>
            <option value="accessories">Accessories</option>
        </select>

        <select id="sortSelect">
            <option value="default">Sort By</option>
            <option value="priceLow">Price: Low to High</option>
            <option value="priceHigh">Price: High to Low</option>
            <option value="name">Name: A-Z</option>
        </select>
    </section>

    <section id="products" class="product-grid"></section>
</main>

<!-- Cart Modal -->
<div id="cartModal" class="modal hidden">
    <div class="modal-content">
        <button id="closeCart" class="close-btn">&times;</button>
        <h2>Your Cart</h2>

        <div id="cartItems"></div>

        <div class="coupon">
            <input type="text" id="couponInput" placeholder="Enter coupon code">
            <button id="couponBtn">Apply</button>
        </div>

        <p id="couponMessage"></p>

        <div class="summary">
            <p>Subtotal: <span id="subtotal">₹0</span></p>
            <p>Discount: <span id="discount">₹0</span></p>
            <h3>Total: <span id="total">₹0</span></h3>
        </div>

        <button id="checkoutBtn" class="checkout-btn">Proceed to Checkout</button>
    </div>
</div>

<!-- Checkout Modal -->
<div id="checkoutModal" class="modal hidden">
    <div class="modal-content checkout">
        <button id="closeCheckout" class="close-btn">&times;</button>
        <h2>Checkout</h2>

        <form id="checkoutForm">
            <input type="text" id="name" placeholder="Full Name" required>
            <input type="email" id="email" placeholder="Email Address" required>
            <input type="text" id="address" placeholder="Delivery Address" required>

            <select id="payment" required>
                <option value="">Select Payment Method</option>
                <option value="card">Credit/Debit Card</option>
                <option value="upi">UPI</option>
                <option value="cod">Cash on Delivery</option>
            </select>

            <button type="submit" class="checkout-btn">Place Order</button>
        </form>

        <p id="orderMessage"></p>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
